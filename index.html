<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Filter Forge · PoE1 過濾器編輯器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Alegreya:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --ground:#0a0806; --panel:#100e0a; --panel2:#171410;
  --rule:#2b2318; --rule-lit:#4b3c26;
  --gold:#c8aa6e; --gold-hi:#efdcae; --gold-dim:#7f6c47;
  --text:#cdc4b1; --muted:#877e6e; --faint:#5d5648;
  --show:#7fae63; --hide:#b0574a; --warn:#d09341;
  --display:'Marcellus SC',serif;
  --serif:'Alegreya','PingFang TC','Microsoft JhengHei',serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --ui:'PingFang TC','Microsoft JhengHei','Noto Sans TC',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--ui);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 700px at 18% -10%,#1a150e 0,transparent 62%),radial-gradient(900px 600px at 105% 110%,#171009 0,transparent 60%);}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2e2618}
::-webkit-scrollbar-thumb:hover{background:#4a3c26}

#app{display:none;height:100vh;flex-direction:column}
#app.on{display:flex}
.topbar{display:flex;align-items:center;gap:14px;padding:0 14px;height:54px;flex:0 0 auto;
  border-bottom:1px solid var(--rule);background:linear-gradient(#151109,#0d0b07)}
.brand{display:flex;align-items:baseline;gap:8px;flex:0 0 auto}
.brand b{font-family:var(--display);font-size:16px;color:var(--gold-hi);font-weight:400;letter-spacing:.06em}
.brand span{font-family:var(--mono);font-size:9px;color:var(--faint);letter-spacing:.16em}
.files{display:flex;gap:2px;align-items:center;overflow-x:auto;flex:1 1 auto;min-width:0;height:100%}
.ftab{flex:0 0 auto;max-width:210px;height:100%;padding:0 12px;display:flex;align-items:center;gap:7px;
  border-bottom:2px solid transparent;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftab:hover{color:var(--text);background:#ffffff06}
.ftab.on{color:var(--gold-hi);border-bottom-color:var(--gold);background:#ffffff08}
.ftab i{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--faint)}
.ftab.dirty i::after{content:' ●';color:var(--gold)}
.tools{display:flex;gap:6px;flex:0 0 auto;align-items:center}
.btn{padding:6px 11px;border:1px solid var(--rule-lit);color:var(--text);font-size:12px;letter-spacing:.03em;background:#ffffff05;transition:.14s;white-space:nowrap}
.btn:hover{border-color:var(--gold-dim);color:var(--gold-hi);background:#c8aa6e14}
.btn.primary{border-color:var(--gold-dim);color:var(--gold-hi);background:#c8aa6e1a}
.btn.primary:hover{background:#c8aa6e2e}
.btn:disabled{opacity:.34;cursor:default}
.btn:disabled:hover{border-color:var(--rule-lit);color:var(--text);background:#ffffff05}
.btn .n{font-family:var(--mono);font-size:10px;color:var(--warn);margin-left:4px}

.stage{flex:1 1 auto;display:grid;grid-template-columns:274px minmax(0,1fr) 406px;min-height:0}
.rail,.bench{background:var(--panel);min-height:0;display:flex;flex-direction:column}
.rail{border-right:1px solid var(--rule)}
.bench{border-left:1px solid var(--rule)}
.stream{min-height:0;display:flex;flex-direction:column;background:#0c0a07}
.paneltitle{flex:0 0 auto;padding:11px 14px 9px;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;
  color:var(--faint);text-transform:uppercase;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center}
.paneltitle b{color:var(--gold-dim);font-weight:500}

.viewsw{display:flex;border-bottom:1px solid var(--rule);flex:0 0 auto}
.viewsw button{flex:1 1 0;padding:8px 4px;font-size:11.5px;color:var(--muted);letter-spacing:.05em;border-bottom:2px solid transparent}
.viewsw button.on{color:var(--gold-hi);border-bottom-color:var(--gold);background:#ffffff07}
.viewsw button:hover{background:#ffffff08}

.outline{overflow-y:auto;padding:5px 0 40px;flex:1 1 auto}
.olrow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:5px 13px;color:var(--muted);font-size:12.5px;transition:.1s}
.olrow:hover{background:#ffffff07;color:var(--text)}
.olrow.on{background:#c8aa6e12;color:var(--gold-hi);box-shadow:inset 2px 0 0 var(--gold)}
.olrow .n{font-family:var(--mono);font-size:10px;color:var(--faint);flex:0 0 auto;min-width:32px}
.olrow .t{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.olrow .c{font-family:var(--mono);font-size:9.5px;color:var(--faint);flex:0 0 auto}
.olrow.g{color:var(--gold-dim);font-family:var(--display);font-size:13px;letter-spacing:.05em;margin-top:7px;border-top:1px solid var(--rule);padding-top:8px}
.olrow.d2{padding-left:25px}.olrow.d3{padding-left:38px}.olrow.d4{padding-left:50px}
.olrow.empty0 .t{color:var(--faint)}
.caret{width:9px;flex:0 0 auto;color:var(--faint);font-size:8px;transition:transform .15s}
.caret.open{transform:rotate(90deg)}
.addcat{margin:10px 12px;padding:8px;border:1px dashed var(--rule-lit);color:var(--muted);font-size:11.5px;width:calc(100% - 24px)}
.addcat:hover{border-color:var(--gold-dim);color:var(--gold-hi)}

.searchbar{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:9px 13px;border-bottom:1px solid var(--rule);background:var(--panel)}
.searchbar input{flex:1 1 auto;background:#0000004d;border:1px solid var(--rule);padding:7px 10px;font-size:13px;outline:none}
.searchbar input:focus{border-color:var(--gold-dim)}
.searchbar input::placeholder{color:var(--faint)}
.vissw{display:flex;border:1px solid var(--rule);flex:0 0 auto}
.vissw button{padding:6px 11px;font-size:11px;color:var(--muted);font-family:var(--mono);letter-spacing:.06em}
.vissw button:hover{background:#ffffff08}
.vissw button.on{background:#c8aa6e1f;color:var(--gold-hi)}
.vissw button.on.s{background:#7fae6322;color:#a9cf90}
.vissw button.on.h{background:#b0574a22;color:#dd9d92}
.countbar{flex:0 0 auto;padding:6px 14px;font-family:var(--mono);font-size:10px;color:var(--faint);border-bottom:1px solid var(--rule);background:#0d0b08}

.list{flex:1 1 auto;overflow-y:auto;padding:4px 0 60px}
.row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:6px 14px 6px 0;
  border-left:4px solid transparent;transition:background .1s}
.row.s{border-left-color:var(--show)}
.row.h{border-left-color:var(--hide);background:repeating-linear-gradient(135deg,#ffffff00 0 6px,#b0574a09 6px 12px)}
.row:hover{background:#ffffff08}
.row.on{background:#c8aa6e16}
.row .state{flex:0 0 auto;width:46px;margin-left:10px;font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;
  text-align:center;padding:3px 0;border:1px solid}
.row.s .state{color:#a9cf90;border-color:#7fae6355;background:#7fae6314}
.row.h .state{color:#dd9d92;border-color:#b0574a55;background:#b0574a14}
.row .body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.row.h .body{opacity:.62}
.row .path{font-family:var(--mono);font-size:9px;color:var(--faint);letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rl{display:flex;align-items:center;gap:8px;min-width:0}
.row .tags{flex:0 0 auto;display:flex;gap:6px;align-items:center;font-family:var(--mono);font-size:9.5px;color:var(--faint)}
.row .bad{color:var(--warn)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.beamdot{width:4px;height:11px;border-radius:2px;display:inline-block}
.gl{display:inline-block;font-family:var(--serif);font-weight:500;padding:.1em .45em;line-height:1.32;
  border:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-shadow:0 1px 1px #000c}
.row .gl{font-size:14px}
.empty{padding:56px 20px;text-align:center;color:var(--faint);font-size:13px;line-height:2}

.bench .body{overflow-y:auto;flex:1 1 auto;padding-bottom:60px}
.nosel{padding:64px 24px;text-align:center;color:var(--faint);font-size:13px;line-height:2}
.stagefloor{position:relative;height:184px;flex:0 0 auto;overflow:hidden;border-bottom:1px solid var(--rule);
  background:radial-gradient(120% 90% at 50% 118%,#241d13 0,#0a0806 68%),#070605}
.stagefloor::after{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(#ffffff09 1px,transparent 1px);background-size:7px 7px;opacity:.5}
.beam{position:absolute;left:50%;bottom:50px;width:30px;height:148px;transform:translateX(-50%);filter:blur(7px);opacity:.72;animation:pulse 3.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5;height:138px}50%{opacity:.85;height:158px}}
.beamcore{position:absolute;left:50%;bottom:50px;width:3px;height:118px;transform:translateX(-50%);filter:blur(1px);opacity:.9}
.glow{position:absolute;left:50%;bottom:42px;width:150px;height:34px;transform:translateX(-50%);border-radius:50%;filter:blur(13px);opacity:.4}
.previewlabel{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);max-width:88%;z-index:2;text-align:center}
.minimapchip{position:absolute;top:11px;right:11px;width:54px;height:54px;border-radius:50%;background:#0d0b0899;
  border:1px solid var(--rule);display:flex;align-items:center;justify-content:center}
.minimapchip.off{opacity:.28}
.soundchip{position:absolute;left:11px;top:11px;max-width:58%;font-family:var(--mono);font-size:9px;color:var(--gold-dim);
  letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec{border-bottom:1px solid var(--rule);padding:13px 15px 17px}
.sec > h3{margin:0 0 11px;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--faint);
  text-transform:uppercase;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec > h3 span{text-transform:none;letter-spacing:.02em;font-size:10px}
.field{margin-bottom:10px}
.field > label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.inp{width:100%;background:#00000059;border:1px solid var(--rule);padding:6px 9px;font-size:12.5px;outline:none}
.inp:focus{border-color:var(--gold-dim)}
textarea.inp{resize:vertical;min-height:50px;font-family:var(--mono);font-size:11.5px;line-height:1.7}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);
  background-position:calc(100% - 14px) 12px,calc(100% - 9px) 12px;background-size:5px 5px;background-repeat:no-repeat}
.seg{display:flex;border:1px solid var(--rule)}
.seg button{flex:1 1 0;padding:7px;font-size:12px;color:var(--muted);letter-spacing:.06em}
.seg button:hover{background:#ffffff08}
.seg button.on{background:#7fae6322;color:#a9cf90}
.seg button.on.h{background:#b0574a22;color:#dd9d92}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
.ci{border:1px solid var(--rule);background:#00000038;padding:7px 7px 6px;position:relative}
.ci > label{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.06em;margin-bottom:5px}
.ci .swwrap{position:relative;height:36px;margin-bottom:5px;border:1px solid var(--rule-lit);
  background-image:linear-gradient(45deg,#2a241a 25%,transparent 25%,transparent 75%,#2a241a 75%),linear-gradient(45deg,#2a241a 25%,#191510 25%,#191510 75%,#2a241a 75%);
  background-size:8px 8px;background-position:0 0,4px 4px}
.ci .swwrap i{position:absolute;inset:0;display:block}
.ci .swwrap input[type=color]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:none;padding:0;background:none}
.ci .none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9.5px;color:var(--faint);pointer-events:none}
.ci input.chex{width:100%;background:#00000059;border:1px solid var(--rule);padding:3px 4px;font-family:var(--mono);font-size:10px;outline:none;text-align:center}
.ci input.chex:focus{border-color:var(--gold-dim)}
.ci input[type=range]{width:100%;margin:1px 0 0}
.ci .x{position:absolute;top:3px;right:4px;font-size:10px;color:var(--faint);padding:1px 3px;line-height:1}
.ci .x:hover{color:var(--hide)}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:20px}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--rule-lit)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;background:var(--gold);margin-top:-4.5px;transform:rotate(45deg)}
input[type=range]::-moz-range-track{height:2px;background:var(--rule-lit)}
input[type=range]::-moz-range-thumb{width:10px;height:10px;background:var(--gold);border:none;border-radius:0;transform:rotate(45deg)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 9px;border:1px solid var(--rule-lit);font-size:11px;color:var(--muted);transition:.12s}
.chip:hover{border-color:var(--gold-dim);color:var(--gold-hi);background:#c8aa6e14}
.palette{display:flex;flex-wrap:wrap;gap:5px;max-height:184px;overflow-y:auto;padding:2px 1px}
.pchip{border:1px solid transparent;padding:1px;line-height:0}
.pchip:hover{border-color:var(--gold-dim)}
.pchip.on{border-color:var(--gold)}
.pchip .gl{font-size:11.5px;max-width:120px}
.scope{display:flex;gap:6px;margin-top:9px}
.scope .chip{flex:1 1 0;text-align:center;line-height:1.4}
.toggle{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:12.5px;color:var(--muted);width:100%;text-align:left}
.toggle .box{width:14px;height:14px;border:1px solid var(--rule-lit);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--gold)}
.toggle.on{color:var(--text)}
.toggle.on .box{border-color:var(--gold-dim)}
.cond{border:1px solid var(--rule);margin-bottom:9px;background:#00000038}
.cond .hd{display:flex;gap:6px;align-items:center;padding:6px 7px;border-bottom:1px solid var(--rule)}
.cond .hd input.k{flex:1 1 auto;min-width:0;background:transparent;border:none;outline:none;font-family:var(--mono);font-size:11.5px;color:var(--gold-hi)}
.cond .hd select{flex:0 0 60px;background:#00000059;border:1px solid var(--rule);font-family:var(--mono);font-size:11px;padding:3px;outline:none}
.cond .hd .x{color:var(--faint);padding:2px 5px}
.cond .hd .x:hover{color:var(--hide)}
.cond textarea{width:100%;background:transparent;border:none;outline:none;padding:7px;font-family:var(--mono);font-size:11.5px;line-height:1.75;resize:vertical;min-height:32px;color:var(--text)}
.cond .tr{padding:0 8px 7px;font-size:11px;color:var(--gold-dim);line-height:1.7}
.addcond{width:100%;padding:7px;border:1px dashed var(--rule-lit);color:var(--muted);font-size:11.5px}
.addcond:hover{border-color:var(--gold-dim);color:var(--gold-hi)}
.groupchips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 10px}
.groupchip{padding:3px 7px;border:1px solid var(--rule-lit);background:#00000038;color:var(--text);font-size:11px}
.groupchip small{color:var(--faint);margin-left:4px;font-family:var(--mono)}
.groupactions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.groupactions .btn{width:100%}
.gitems{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:10px 0 14px}
.gitem{display:flex;align-items:flex-start;gap:9px;padding:9px;border:1px solid var(--rule);background:#00000035;cursor:pointer}
.gitem:hover{border-color:var(--gold-dim);background:#c8aa6e0c}
.gitem input{margin-top:3px;accent-color:var(--gold)}
.gitem b{display:block;color:var(--text);font-weight:500}
.gitem small{display:block;color:var(--faint);font-family:var(--mono);font-size:9.5px;word-break:break-word}
.tierrows{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.tierrow{display:grid;grid-template-columns:104px repeat(3,minmax(84px,1fr)) 34px;gap:8px;align-items:end;padding:10px;border:1px solid var(--rule);background:#00000035}
.tierrow label{display:block;color:var(--muted);font-size:10.5px}
.tierrow input[type=number]{margin-top:4px}
.tiercolor{height:34px;width:100%;margin-top:4px;padding:2px;border:1px solid var(--rule-lit);background:#0b0906;cursor:pointer}
.tierremove{height:34px;border:1px solid var(--rule-lit);color:var(--hide);font-size:14px}
.tierremove:hover{border-color:var(--hide);background:#b0574a18}
.presetgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:10px 0 14px}
.presetcard{padding:8px;border:1px solid var(--rule);background:#00000038;text-align:left}
.presetcard:hover{border-color:var(--gold-dim)}
.presetcard.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px #c8aa6e55;background:#c8aa6e0e}
.presetcard .gl{display:block;text-align:center;max-width:none;margin-bottom:5px;padding:3px 5px}
.presetcard small{display:block;color:var(--faint);font-family:var(--mono);font-size:9px;text-align:center}
.presetitems{max-height:330px;overflow:auto;border:1px solid var(--rule);margin-top:8px}
.presetitem{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 9px;border-bottom:1px solid #ffffff08;cursor:pointer}
.presetitem:hover{background:#ffffff07}
.presetitem input{accent-color:var(--gold)}
.presetitem b{font-weight:500}
.presetitem small{color:var(--faint);font-size:9.5px;font-family:var(--mono)}
.presetitem em{font-style:normal;color:var(--gold-dim);font-size:10px;white-space:nowrap}
.warn{font-size:11px;color:var(--warn);margin-top:5px}
.hintline{font-size:11px;color:var(--faint);margin-top:6px;line-height:1.7}
.lintlist{margin:0;padding:0;list-style:none}
.lintlist li{padding:6px 8px;border-left:2px solid var(--warn);background:#d093410d;margin-bottom:5px;font-size:11.5px;color:#dcb87f}
.lintlist li.err{border-left-color:var(--hide);background:#b0574a12;color:#e2a89e}
.tabs{display:flex;border-bottom:1px solid var(--rule);flex:0 0 auto}
.tabs button{flex:1 1 0;padding:9px;font-size:11.5px;color:var(--muted);letter-spacing:.08em;border-bottom:2px solid transparent}
.tabs button.on{color:var(--gold-hi);border-bottom-color:var(--gold)}
.tabs button:hover{background:#ffffff06}
.srcbox{width:100%;min-height:330px;background:#00000059;border:1px solid var(--rule);padding:11px;font-family:var(--mono);
  font-size:11.5px;line-height:1.8;outline:none;resize:vertical;white-space:pre;overflow-x:auto}
.srcbox:focus{border-color:var(--gold-dim)}

#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:26px;padding:30px;text-align:center}
#gate.off{display:none}
.gatemark{position:relative;width:200px;height:150px}
.gatemark .b{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);width:34px;height:116px;filter:blur(9px);opacity:.6;background:linear-gradient(to top,#c8aa6e,transparent)}
.gatemark .l{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-family:var(--serif);font-size:19px;padding:.12em .5em;border:1px solid #c8aa6e;background:#000000d9;color:#efdcae;white-space:nowrap}
h1{font-family:var(--display);font-size:28px;font-weight:400;color:var(--gold-hi);margin:0;letter-spacing:.08em}
#gate p{margin:0;color:var(--muted);font-size:13.5px;max-width:520px;line-height:1.95}
#gate .k{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.12em}
.dropzone{border:1px dashed var(--rule-lit);padding:24px 42px;transition:.15s;display:flex;flex-direction:column;gap:11px;align-items:center}
.dropzone.hot{border-color:var(--gold);background:#c8aa6e12}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c1710;border:1px solid var(--gold-dim);
  color:var(--gold-hi);padding:9px 18px;font-size:12.5px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:#000000c4;display:none;align-items:center;justify-content:center;z-index:80;padding:24px}
.modal.on{display:flex}
.modalbox{background:var(--panel2);border:1px solid var(--rule-lit);max-width:780px;width:100%;max-height:86vh;display:flex;flex-direction:column}
.modalbox h2{margin:0;padding:14px 18px;font-family:var(--display);font-size:16px;font-weight:400;color:var(--gold-hi);
  border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center}
.modalbody{overflow-y:auto;padding:14px 18px}
.modalfoot{padding:12px 18px;border-top:1px solid var(--rule);display:flex;gap:8px;justify-content:flex-end}
.issue{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #ffffff08;width:100%;text-align:left}
.issue:hover{background:#ffffff06}
.issue .lv{flex:0 0 42px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;padding:2px 0;text-align:center;border:1px solid}
.issue .lv.e{color:#e2a89e;border-color:#b0574a55}
.issue .lv.w{color:#dcb87f;border-color:#d0934155}
.issue .tx{flex:1 1 auto;min-width:0;font-size:12px}
.issue .tx b{display:block;color:var(--muted);font-weight:400;font-size:10.5px;font-family:var(--mono);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media (max-width:1240px){.stage{grid-template-columns:230px minmax(0,1fr) 352px}}
@media (max-width:960px){
  .stage{grid-template-columns:1fr}
  .rail{display:none}
  .bench{position:fixed;inset:54px 0 0;z-index:20;border-left:none;display:none}
  .bench.open{display:flex}
  .gitems{grid-template-columns:1fr}
  .tierrow{grid-template-columns:1fr 1fr}
  .tierremove{grid-column:2}
  .presetgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<div id="gate">
  <div class="gatemark"><div class="b"></div><div class="l">無效石</div></div>
  <h1>Filter Forge</h1>
  <p>流亡黯道 1 的掉落過濾器編輯器。英文與簡體過濾器都會換上台服官方繁中譯名，套用統一的分類架構，並即時預覽地上的物品標籤。</p>
  <div class="dropzone" id="dz">
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
      <button class="btn primary" id="gateNew">新建 Filter</button>
      <button class="btn" id="gatePick">開啟 .filter 檔</button>
      <a class="btn" href="README_防呆與操作說明.md" target="_blank" rel="noopener" style="text-decoration:none">操作與防呆說明</a>
    </div>
    <span class="k">或把檔案拖進這個框，可一次開多個</span>
  </div>
</div>

<div id="app">
  <header class="topbar">
    <div class="brand"><b>Filter Forge</b><span>POE1</span></div>
    <div class="files" id="files"></div>
    <div class="tools">
      <button class="btn" id="nameMode" title="切換區塊名稱來源">官方譯名</button>
      <button class="btn" id="undoBtn" title="復原 Ctrl+Z" disabled>復原</button>
      <button class="btn" id="redoBtn" title="重做 Ctrl+Shift+Z" disabled>重做</button>
      <button class="btn" id="stylePresets">樣式階級</button>
      <button class="btn" id="safetyBtn">防呆</button>
      <button class="btn" id="lintBtn">檢查<span class="n" id="lintN"></span></button>
      <button class="btn" id="newDoc">新建</button>
      <button class="btn" id="pick">開啟</button>
      <a class="btn" href="README_防呆與操作說明.md" target="_blank" rel="noopener" style="text-decoration:none">說明</a>
      <button class="btn" id="save">匯出</button>
      <button class="btn primary" id="saveTW">匯出繁體版</button>
    </div>
  </header>

  <div class="stage">
    <aside class="rail">
      <div class="viewsw">
        <button data-v="taxonomy" class="on">標準分類</button>
        <button data-v="native">檔案原生章節</button>
      </div>
      <div class="outline" id="outline"></div>
      <button class="addcat" id="addcat">＋ 自訂分類</button>
    </aside>

    <section class="stream">
      <div class="searchbar">
        <input id="q" type="search" placeholder="搜尋名稱、譯名、BaseType、Class、詞綴…">
        <div class="vissw" id="vissw">
          <button data-v="all" class="on">全部</button>
          <button data-v="show">SHOW</button>
          <button data-v="hide">HIDE</button>
        </div>
      </div>
      <div class="countbar" id="count"></div>
      <div class="list" id="list"></div>
    </section>

    <aside class="bench" id="bench">
      <div class="stagefloor" id="floor"></div>
      <div class="tabs">
        <button data-tab="props" class="on">屬性</button>
        <button data-tab="src">原始碼</button>
      </div>
      <div class="body" id="inspector"></div>
    </aside>
  </div>
</div>

<input type="file" id="fileinput" accept=".filter,.txt" multiple style="display:none">
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="modalbox">
  <h2><span id="modalTitle"></span><button class="btn" id="modalClose">關閉</button></h2>
  <div class="modalbody" id="modalBody"></div>
  <div class="modalfoot" id="modalFoot"></div>
</div></div>

function splitComment(s){
  let q=false;
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(c==='"') q=!q;
    else if(c==='#'&&!q) return {code:s.slice(0,i),comment:s.slice(i+1)};
  }
  return {code:s,comment:null};

function tokenize(s){
  const out=[]; let i=0;

    const c=s[i];

    let j=i,buf=''; while(j<s.length&&!/\s/.test(s[j])){buf+=s[j];j++;} out.push({v:buf,q:false}); i=j;
  }

function parseRule(raw){
  const indent=(raw.match(/^[ \t]*/)||[''])[0];

  const toks=tokenize(body);
  if(!toks.length) return {raw,unknown:true};
  const key=toks[0].v;
  let idx=1,op='';
  const t1=toks[1];
  if(t1&&!t1.q){
    if(/^(==|!=|<=|>=|=|<|>|!)$/.test(t1.v)){op=t1.v;idx=2;}
    else{ const m=t1.v.match(/^(==|!=|<=|>=|=|<|>|!)(.+)$/); if(m){op=m[1];toks[1]={v:m[2],q:false};idx=1;} }

function parseDoc(text,name){
  const eol=text.indexOf('\r\n')>=0?'\r\n':'\n';

  let cur=null,i=0,uid=0;
  while(i<lines.length){
    const line=lines[i];
    const m=line.match(/^([ \t]*)(Show|Hide)\b(.*)$/);
    if(m){
      const {comment}=splitComment(m[3]);
      const b={kind:'block',id:'b'+(uid++),type:m[2],indent:m[1],headComment:comment,headRaw:line,
               rules:[],section:cur?cur.id:null,dirty:false};
      i++;

        const c=lines[i];
        if(c.trim()===''||!/^[ \t]/.test(c)) break;
        b.rules.push(parseRule(c)); i++;
      }
      nodes.push(b); blocks.push(b);
      if(cur) cur.count++;
      continue;
    }
    /* 章節標題：支援「# 1.1 標題」與 NeverSink 的「# [[0200]] 標題」／「#   [0301] 標題」 */
    let num=null,title=null,depth=1;
    let sm=line.match(/^#\s*([0-9]+(?:\.[0-9]+)*)\s+(.+)$/);
    if(sm && !/^#\s*\[/.test(line)){ num=sm[1]; title=sm[2]; depth=Math.min(4,num.split('.').length); }
    else{
      sm=line.match(/^#\s*\[\[([0-9A-Za-z]+)\]\]\s*(.+)$/);
      if(sm){ num=sm[1]; title=sm[2]; depth=1; }
      else{
        sm=line.match(/^#\s+\[([0-9A-Za-z]+)\]\s*(.+)$/);
        if(sm){ num=sm[1]; title=sm[2]; depth=2; }
      }
    }
    if(num!==null && !/^[-=]+$/.test(title)){
      cur={kind:'section',id:'s'+(uid++),num,title:title.trim(),depth,count:0};
      sections.push(cur);
    }
    nodes.push({kind:'raw',text:line});
    i++;
  }
  /* NeverSink 前面的目錄會重複列出所有章節編號，只保留第一個 Show/Hide 之後真正用到的 */
  const used=new Set(blocks.map(b=>b.section));
  const trimmed=sections.filter(s=>used.has(s.id)||s.count>0);
  return {name,eol,nodes,blocks,sections:trimmed.length?trimmed:sections,dirty:false};
}
function serializeDoc(doc,toTW){
  const out=[];

    if(n.kind==='raw'){ out.push(n.text); continue; }
    if(!n.dirty&&n.headRaw!=null) out.push(n.headRaw);
    else out.push(n.indent+n.type+(n.headComment!=null&&n.headComment!==''?' #'+n.headComment:''));
    for(const r of n.rules) out.push(serializeRule(r));
  }
  const lines = toTW ? out.map(l=>{
    const s=splitComment(l);
    if(s.comment==null) return l;
    return s.code+'#'+s.comment.split(/("[^"]*")/).map((p,i)=>i%2?p:twConv(p)).join('');
  }) : out;
  return lines.join(doc.eol);
}

function hexColor(c,fallback){

/* 名稱：官方譯名優先，找不到才用作者註解 */
function nameSource(b){
  const bt=findRule(b,'BaseType'), cl=findRule(b,'Class');
  const r=(bt&&bt.values.length)?bt:((cl&&cl.values.length)?cl:null);
  if(!r) return null;
  return {key:r.key,vals:r.values.map(v=>v.v)};
}
function officialName(b){
  const s=nameSource(b); if(!s) return null;
  const out=s.vals.map(v=>tr(v)||v.trim());
  if(!out.length) return null;
  if(out.length<=2) return out.join('、');
  return out[0]+'、'+out[1]+' 等 '+out.length+' 項';
}
function tagsOf(b){
  return [...String(b.headComment||'').matchAll(/\$(\w+)->(\S+)/g)].map(m=>({k:m[1],v:m[2]}));
}
function authorName(b){
  const c=(b.headComment||'').trim();
  if(!c) return null;
  const clean=c.replace(/%\w+\s*/g,'').replace(/\$\w+->\S+/g,'').trim();
  if(clean){ const p=clean.split(/\s*-\s*/); return T(p[p.length-1]||clean); }
  const tags=tagsOf(b);
  if(tags.length){
    const tier=tags.find(t=>t.k==='tier')||tags[tags.length-1];
    return tier.v.replace(/->/g,' · ');
  }
  const p=c.split(/\s*-\s*/);
  return T(p[p.length-1]||c);
}
function displayName(b){
  const a=state.nameMode==='official'?(officialName(b)||authorName(b)):(authorName(b)||officialName(b));
  return a||'（無條件的區塊）';
}
function pathName(b){
  const c=(b.headComment||'').trim();
  const tags=tagsOf(b);
  if(tags.length) return tags.map(t=>t.k+'→'+t.v.replace(/->/g,'·')).join('   ');
  if(!c) return '';

}
function blockText(b){
  if(b._t) return b._t;

  for(const r of b.rules){
    if(r.unknown){ t.push(r.raw); continue; }
    t.push(r.key);

  }
  return (b._t=t.join(' ').toLowerCase());
}

const MM_SIZES=['0','1','2'];
const NAMED={Red:'#d13a33',Green:'#3fb54a',Blue:'#3f6fe0',Brown:'#a3673a',White:'#f2f0ea',Yellow:'#e6cf3c',
  Cyan:'#3ed0d6',Grey:'#9a958c',Orange:'#ef8a2a',Pink:'#f07cb6',Purple:'#a755d8'};
const MM_COLORS=Object.keys(NAMED);
const MM_SHAPES=['Circle','Diamond','Hexagon','Square','Star','Triangle','Cross','Moon','Raindrop','Kite','Pentagon','UpsideDownHouse'];

function lint(b){
  const out=[];
  const conds=b.rules.filter(r=>!r.unknown&&!/^(Set|Play|Minimap|Custom|Disable|Enable|Continue)/i.test(r.key));
  if(!conds.length&&!findRule(b,'Continue')){
    out.push(b.type==='Hide'
      ? {lv:'w',msg:'沒有任何條件的 Hide：會擋掉所有沒被上面規則攔截的物品。放在檔尾是正常收尾，放在中間會吃掉後面的規則'}
      : {lv:'e',msg:'沒有任何條件的 Show：會顯示所有沒被上面規則攔截的物品'});
  }
  const fs=getNum(b,'SetFontSize');
  if(fs!=null&&(fs<18||fs>45)) out.push({lv:'w',msg:`字級 ${fs} 超出遊戲可用範圍 18–45，實際會被夾到 ${fs<18?18:45}`});
  for(const k of ['SetTextColor','SetBackgroundColor','SetBorderColor']){
    const r=findRule(b,k); if(!r) continue;
    if(r.values.length<3){ out.push({lv:'e',msg:`${k} 少於 3 個數值`}); continue; }
    if(r.values.some(v=>{const n=+v.v;return isNaN(n)||n<0||n>255;})) out.push({lv:'e',msg:`${k} 有數值不在 0–255 之間`});
  }
  const mm=getMinimap(b);
  if(mm){
    if(!MM_SIZES.includes(String(mm.size))) out.push({lv:'e',msg:'MinimapIcon 尺寸只能是 0、1、2'});
    if(!MM_COLORS.includes(mm.color)) out.push({lv:'e',msg:`MinimapIcon 顏色「${mm.color}」不是合法值`});
    if(!MM_SHAPES.includes(mm.shape)) out.push({lv:'e',msg:`MinimapIcon 形狀「${mm.shape}」不是合法值`});
  }
  const bm=getBeam(b);
  if(bm&&!MM_COLORS.includes(bm.color)) out.push({lv:'e',msg:`PlayEffect 顏色「${bm.color}」不是合法值`});
  if(b.type==='Hide'){
    const wasted=['PlayEffect','MinimapIcon','CustomAlertSound','PlayAlertSound'].filter(k=>findRule(b,k));
    if(wasted.length) out.push({lv:'w',msg:`Hide 區塊上的 ${wasted.join('、')} 不會生效`});
  }
  for(const r of b.rules){
    if(r.unknown) continue;
    if(!KNOWN.has(r.key.toLowerCase())) out.push({lv:'w',msg:`不認得的關鍵字 ${r.key}`});
    if(STRINGY.has(r.key.toLowerCase())){
      const seen=new Set();
      for(const v of r.values){ if(seen.has(v.v)){ out.push({lv:'w',msg:`${r.key} 有重複的值「${v.v}」`}); break; } seen.add(v.v); }
    }
  }
  return out;
}
function lintAll(){
  const res=[];
  for(const b of state.doc.blocks){ const p=lint(b); if(p.length) res.push({b,issues:p}); }
  return res;
}
/* 同類問題合併成一組，避免 600 條「字級超出範圍」洗版 */
function lintGroups(){
  const map=new Map();
  for(const b of state.doc.blocks){
    for(const i of lint(b)){
      const key=i.lv+'|'+i.msg.replace(/「[^」]*」/g,'「…」').replace(/\b\d+\b/g,'N');
      let g=map.get(key);
      if(!g){ g={lv:i.lv,msg:i.msg,n:0,blocks:[]}; map.set(key,g); }
      g.n++; if(g.blocks.length<12) g.blocks.push(b);
    }
  }
  const out=[...map.values()].sort((a,b)=>(a.lv===b.lv?b.n-a.n:(a.lv==='e'?-1:1)));
  const safe=safetyState();
  if(!safe.ok) out.unshift({lv:'e',msg:!safe.b?'缺少最後的未分類物品防呆層':'未分類物品防呆層不在最後或缺少特殊色／提示',n:1,blocks:safe.b?[safe.b]:[]});
  return out;
}

function snap(blocks,label){

  state.lastSnap=now;
  state.undo.push({kind:'blocks',label,items:blocks.map(b=>({id:b.id,type:b.type,headComment:b.headComment,rules:cloneData(b.rules)}))});
  if(state.undo.length>80) state.undo.shift();

  return {nodes:cloneData(d.nodes),sections:cloneData(d.sections),dirty:d.dirty,sel:state.sel};
}
function restoreDoc(d,s){
  d.nodes=cloneData(s.nodes);
  d.blocks=d.nodes.filter(n=>n.kind==='block');
  d.sections=cloneData(s.sections);
  d.dirty=s.dirty;
  state.sel=s.sel&&d.blocks.some(b=>b.id===s.sel)?s.sel:(d.blocks[0]?.id||null);

  state.undo.push({kind:'doc',label,doc:state.doc,state:captureDoc(state.doc)});
  if(state.undo.length>80) state.undo.shift();

}
function applySnap(entry){
  if(entry.kind==='doc'){
    const inv={kind:'doc',label:entry.label,doc:entry.doc,state:captureDoc(entry.doc)};
    restoreDoc(entry.doc,entry.state);
    return inv;
  }
  const inv={kind:'blocks',label:entry.label,items:entry.items.map(it=>{
    const b=state.doc.blocks.find(x=>x.id===it.id);
    return {id:it.id,type:b?.type,headComment:b?.headComment,rules:cloneData(b?.rules||[])};
  })};
  for(const it of entry.items){
    const b=state.doc.blocks.find(x=>x.id===it.id); if(!b) continue;
    b.type=it.type; b.headComment=it.headComment; b.rules=it.rules; b._t=null; b._cat=null;
  }
  return inv;
}

function shapeSVG(shape,color,px){
  const f=NAMED[color]||'#bbb';
  const P=p=>`<polygon points="${p}" fill="${f}"/>`;
  let inner;
  switch(shape){
    case 'Circle': inner=`<circle cx="50" cy="50" r="40" fill="${f}"/>`; break;
    case 'Diamond': inner=P('50,6 94,50 50,94 6,50'); break;
    case 'Hexagon': inner=P('50,6 90,28 90,72 50,94 10,72 10,28'); break;
    case 'Square': inner=`<rect x="12" y="12" width="76" height="76" fill="${f}"/>`; break;
    case 'Star': inner=P('50,4 61,36 96,36 68,57 78,92 50,71 22,92 32,57 4,36 39,36'); break;
    case 'Triangle': inner=P('50,8 93,88 7,88'); break;
    case 'Cross': inner=P('36,6 64,6 64,36 94,36 94,64 64,64 64,94 36,94 36,64 6,64 6,36 36,36'); break;
    case 'Moon': inner=`<path d="M70 12a44 44 0 1 0 0 76 46 46 0 0 1 0-76z" fill="${f}"/>`; break;
    case 'Raindrop': inner=`<path d="M50 4c18 26 34 40 34 58a34 34 0 0 1-68 0c0-18 16-32 34-58z" fill="${f}"/>`; break;
    case 'Kite': inner=P('50,4 88,40 50,96 12,40'); break;
    case 'Pentagon': inner=P('50,5 95,38 78,92 22,92 5,38'); break;
    case 'UpsideDownHouse': inner=P('12,8 88,8 88,52 50,95 12,52'); break;
    default: inner=`<circle cx="50" cy="50" r="30" fill="none" stroke="${f}" stroke-width="8"/>`;
  }
  return `<svg width="${px}" height="${px}" viewBox="0 0 100 100">${inner}</svg>`;
}

function renderFiles(){
  $('#files').innerHTML=state.docs.map((d,i)=>
    `<button class="ftab ${d===state.doc?'on':''} ${d.dirty?'dirty':''}" data-i="${i}">${esc(d.name)} <i>${d.blocks.length}</i></button>`).join('');
}
function renderOutline(){
  const d=state.doc,rows=[];
  if(state.view==='taxonomy'){
    const counts={};
    for(const b of d.blocks){ const c=classify(b); counts[c]=(counts[c]||0)+1; }
    rows.push(`<button class="olrow ${state.cat===null?'on':''}" data-cat="">
      <span class="n">全部</span><span class="t">所有區塊</span><span class="c">${d.blocks.length}</span></button>`);
    const all=[...state.userCats,...TAX];
    for(const t of all){
      const n=counts[t.id]||0;
      rows.push(`<button class="olrow ${n?'':'empty0'} ${state.cat===t.id?'on':''}" data-cat="${t.id}">
        <span class="n">${t.id}</span><span class="t">${esc(t.name)}</span><span class="c">${n||'—'}</span></button>`);
    }
    $('#outline').innerHTML=rows.join('');
    $('#addcat').style.display='';
    return;
  }
  $('#addcat').style.display='none';
  if(!d.sections.length){
    $('#outline').innerHTML=`<div class="empty">這個檔案沒有章節標題<br><span style="font-size:11.5px">切到「標準分類」就能照物品類型瀏覽</span></div>`;
    return;
  }
  rows.push(`<button class="olrow ${state.section===null?'on':''}" data-sec="">
    <span class="caret"></span><span class="n">全部</span><span class="t">所有區塊</span><span class="c">${d.blocks.length}</span></button>`);
  let group=null;
  for(const s of d.sections){
    if(s.depth===1){
      group=s.num;
      const open=state.open.has(group);
      rows.push(`<button class="olrow g ${state.section===s.id?'on':''}" data-sec="${s.id}" data-grp="${group}">
        <span class="caret ${open?'open':''}">▶</span><span class="n">${s.num}</span>
        <span class="t">${esc(T(s.title))}</span><span class="c">${s.count||''}</span></button>`);
    }else{
      if(group&&!state.open.has(group)) continue;
      rows.push(`<button class="olrow d${s.depth} ${state.section===s.id?'on':''}" data-sec="${s.id}">
        <span class="n">${s.num}</span><span class="t">${esc(T(s.title))}</span><span class="c">${s.count||''}</span></button>`);
    }
  }
  $('#outline').innerHTML=rows.join('');
}
function visibleBlocks(){
  const d=state.doc,q=state.query.trim().toLowerCase();
  let arr=d.blocks;
  if(q) arr=arr.filter(b=>blockText(b).includes(q));
  else if(state.view==='taxonomy'&&state.cat) arr=arr.filter(b=>classify(b)===state.cat);
  else if(state.view==='native'&&state.section) arr=arr.filter(b=>b.section===state.section);
  if(state.vis==='show') arr=arr.filter(b=>b.type==='Show');
  else if(state.vis==='hide') arr=arr.filter(b=>b.type==='Hide');
  return arr;
}
function rowHTML(b){
  const fs=getNum(b,'SetFontSize')||32;
  const px=Math.max(11,Math.min(20,fs*0.36+7));
  const mm=getMinimap(b),beam=getBeam(b),snd=getSound(b),p=pathName(b);
  const bad=lint(b);
  return `<button class="row ${b.type==='Show'?'s':'h'} ${state.sel===b.id?'on':''}" data-id="${b.id}">
    <span class="state">${b.type==='Show'?'SHOW':'HIDE'}</span>
    <span class="body">
      ${p?`<span class="path">${esc(p)}</span>`:''}
      <span class="rl"><span class="gl" style="${labelStyle(b,px)}">${esc(displayName(b))}</span></span>
    </span>
    <span class="tags">
      ${bad.length?`<span class="bad" title="${esc(bad[0].msg)}">⚠</span>`:''}
      ${snd?'<span title="音效">♪</span>':''}
      ${beam?`<span class="beamdot" style="background:${NAMED[beam.color]||'#ccc'}"></span>`:''}
      ${mm?`<span class="dot" style="background:${NAMED[mm.color]||'#ccc'}"></span>`:''}
      <span>${fs}</span>
    </span>
  </button>`;
}
function renderList(reset){
  const arr=visibleBlocks(),el=$('#list');
  if(reset!==false){ state.shown=0; el.innerHTML=''; }
  if(!arr.length){ el.innerHTML='<div class="empty">這裡沒有符合的區塊</div>'; updateCount(0); return; }
  const next=Math.min(arr.length,state.shown+150);
  el.insertAdjacentHTML('beforeend',arr.slice(state.shown,next).map(rowHTML).join(''));
  state.shown=next;
  updateCount(arr.length);
}
function updateCount(total){
  const arr=visibleBlocks();
  const s=arr.filter(b=>b.type==='Show').length;
  const scope = state.query ? '搜尋結果'
    : state.view==='taxonomy' ? (state.cat?catName(state.cat):'全部')
    : (state.section?(state.doc.sections.find(x=>x.id===state.section)||{}).title:'全部');
  $('#count').textContent=`${T(scope||'')} · ${total} 個區塊（${s} Show / ${total-s} Hide）`+
    (state.shown<total?` · 已載入 ${state.shown}`:'');
}
function curBlock(){ return state.doc?state.doc.blocks.find(b=>b.id===state.sel):null; }
function renderFloor(){
  const b=curBlock(),el=$('#floor');
  if(!b){ el.innerHTML=''; return; }
  const fs=getNum(b,'SetFontSize')||32;
  const px=Math.max(13,Math.min(40,fs*0.62));
  const beam=getBeam(b),mm=getMinimap(b),snd=getSound(b);
  const bc=beam?(NAMED[beam.color]||'#ccc'):null;
  const hidden=b.type==='Hide';
  el.innerHTML=`
    ${bc&&!hidden?`<div class="beam" style="background:linear-gradient(to top,${bc},transparent)"></div>
      <div class="beamcore" style="background:${bc}"></div><div class="glow" style="background:${bc}"></div>`:''}
    <div class="previewlabel">${hidden
      ?`<span style="color:#6b6355;font-size:11px;font-family:var(--mono);letter-spacing:.14em">HIDE · 地上不顯示</span>`
      :`<span class="gl" style="${labelStyle(b,px)}">${esc(displayName(b))}</span>`}</div>
    <div class="minimapchip ${mm?'':'off'}">${mm?shapeSVG(mm.shape,mm.color,[26,20,15][mm.size]||18):'<span style="color:#3a3428;font-size:9.5px">無圖示</span>'}</div>
    ${snd?`<div class="soundchip">♪ ${esc(snd.split(/[\\/]/).pop())}</div>`:''}`;
}
function colorCell(b,key,label){
  const c=getColor(b,key);
  const hex=c?('#'+[c.r,c.g,c.b].map(x=>x.toString(16).padStart(2,'0')).join('')):'';
  return `<div class="ci" data-ckey="${key}">
    <label>${label}</label>
    <div class="swwrap"><i style="background:${css(c,'transparent')}"></i>
      <input type="color" class="cpick" value="${hex||'#ffffff'}"><
      ${c?'':'<span class="none">未設定</span>'}</div>
    <input type="text" class="chex" value="${hex}" placeholder="未設定" maxlength="7" spellcheck="false">
    <input type="range" class="calpha" min="0" max="255" value="${c?c.a:255}">
    ${c?'<button class="x" title="移除">✕</button>':''}
  </div>`;
}
function paletteOf(doc){
  const map=new Map();
  for(const b of doc.blocks){
    const fg=getColor(b,'SetTextColor'),bg=getColor(b,'SetBackgroundColor'),bd=getColor(b,'SetBorderColor');
    if(!fg&&!bg&&!bd) continue;
    const k=[fg,bg,bd].map(c=>c?`${c.r},${c.g},${c.b},${c.a}`:'-').join('|');
    let e=map.get(k);
    if(!e){ e={k,fg,bg,bd,count:0,labels:new Map()}; map.set(k,e); }
    e.count++;
    const r=findRule(b,'SetTextColor')||findRule(b,'SetBackgroundColor');
    const l=((r&&r.comment)||'').trim();
    if(l&&l.length<14) e.labels.set(l,(e.labels.get(l)||0)+1);
  }
  const arr=[...map.values()];
  for(const e of arr){ let best='',n=0; for(const [l,c] of e.labels) if(c>n){best=l;n=c;} e.label=T(best)||('配色 '+e.count); }
  arr.sort((a,b)=>b.count-a.count);
  return arr.slice(0,60);
}
function palStyle(p){ return `color:${css(p.fg,DEF_FG)};background:${css(p.bg,DEF_BG)};border-color:${css(p.bd,'transparent')}`; }
function applyPalette(b,p){
  [['SetTextColor',p.fg],['SetBackgroundColor',p.bg],['SetBorderColor',p.bd]].forEach(([k,c])=>{
    if(!c) dropRule(b,k); else putRule(b,k,c.a>=255?[c.r,c.g,c.b]:[c.r,c.g,c.b,c.a]);
  });
}
function curPalette(b){ return {fg:getColor(b,'SetTextColor'),bg:getColor(b,'SetBackgroundColor'),bd:getColor(b,'SetBorderColor')}; }

function renderInspector(){
  const b=curBlock(),el=$('#inspector');
  if(!b){ el.innerHTML='<div class="nosel">從中間的清單選一個區塊<br>右側會顯示它的樣式、條件與檢查結果</div>'; return; }
  if(state.tab==='src'){
    const src=[(b.headRaw&&!b.dirty)?b.headRaw:(b.indent+b.type+(b.headComment?' #'+b.headComment:''))]
      .concat(b.rules.map(serializeRule)).join('\n');
    el.innerHTML=`<div class="sec"><h3>原始碼<span>改完按套用</span></h3>
      <textarea class="srcbox" id="srcbox" spellcheck="false">${esc(src)}</textarea>
      <button class="btn primary" id="applysrc" style="width:100%;margin-top:9px">套用這段原始碼</button>
      <div class="hintline">套用前會先檢查：第一行必須是 Show 或 Hide，否則不會寫入。</div></div>`;
    return;
  }
  const fs=getNum(b,'SetFontSize'), mm=getMinimap(b), beam=getBeam(b);
  const snd=(findRule(b,'CustomAlertSound')||{values:[]}).values[0]?.v||'';
  const noDrop=getBool(b,'DisableDropSound');
  const conds=b.rules.filter(r=>!r.unknown&&!/^(Set|Play|Minimap|Custom|Disable|Enable)/i.test(r.key));
  const palSrc=state.docs.find(d=>d.name===state.palFrom)||state.doc;
  const pal=paletteOf(palSrc);
  const cp=curPalette(b);
  const curKey=[cp.fg,cp.bg,cp.bd].map(c=>c?`${c.r},${c.g},${c.b},${c.a}`:'-').join('|');
  const scopeName=state.view==='taxonomy'?catName(classify(b)):'這一節';
  const scopeList=state.view==='taxonomy'
    ? state.doc.blocks.filter(x=>classify(x)===classify(b))
    : state.doc.blocks.filter(x=>x.section===b.section);
  const issues=lint(b);
  const ns=nameSource(b);
  const bt=positiveBaseRule(b);
  const isCurrency=classify(b)==='1';
  const stackRule=findRule(b,'StackSize');

  el.innerHTML=`
  ${issues.length?`<div class="sec"><h3>檢查<span>${issues.length} 項</span></h3>
    <ul class="lintlist">${issues.map(i=>`<li class="${i.lv==='e'?'err':''}">${esc(i.msg)}</li>`).join('')}</ul></div>`:''}

  <div class="sec">
    <h3>區塊<span>${esc(catName(classify(b)))}</span></h3>
    <div class="seg" id="showhide">
      <button class="${b.type==='Show'?'on':''}" data-t="Show">SHOW 顯示</button>
      <button class="${b.type==='Hide'?'on h':''}" data-t="Hide">HIDE 隱藏</button>
    </div>
    ${ns?`<div class="hintline">名稱取自 ${ns.key}：${esc(ns.vals.slice(0,3).map(v=>(tr(v)?tr(v)+'（'+v+'）':v)).join('、'))}${ns.vals.length>3?' …':''}</div>`:''}
    <div class="field" style="margin-top:10px">
      <label>作者註解</label>
      <input class="inp" id="hc" value="${esc(T(b.headComment||''))}">
    </div>
  </div>

  ${bt?`<div class="sec">
    <h3>物品群組<span>${bt.values.length} 項${stackRule?' · StackSize '+esc(stackRule.op||'=')+' '+esc(stackRule.values.map(v=>v.v).join(' ')):''}</span></h3>
    <div class="groupchips">${bt.values.slice(0,12).map(v=>`<span class="groupchip">${esc(tr(v.v)||v.v)}${tr(v.v)?`<small>${esc(v.v)}</small>`:''}</span>`).join('')}
      ${bt.values.length>12?`<span class="groupchip">…還有 ${bt.values.length-12} 項</span>`:''}</div>
    <div class="groupactions">
      <button class="btn primary" id="manageGroup">拆分／移動物品</button>
      ${isCurrency&&!stackRule?'<button class="btn" id="stackTiers">依掉落數量分色</button>':'<button class="btn" disabled title="只適用於沒有 StackSize 條件的通貨群組">依掉落數量分色</button>'}
    </div>
    <div class="hintline">拆分會複製目前規則與配色；移動只會列出 SHOW／HIDE、Class、其他條件和堆疊條件都相同的安全目標群組。</div>
  </div>`:''}

  <div class="sec">
    <h3>顏色<span>點色塊開調色盤</span></h3>
    <div class="trio">${colorCell(b,'SetTextColor','文字')}${colorCell(b,'SetBackgroundColor','背景')}${colorCell(b,'SetBorderColor','邊框')}</div>
    <div class="quick">
      <button class="chip" id="bdText">邊框＝文字色</button>
      <button class="chip" id="bdBg">邊框＝背景色</button>
      <button class="chip" id="bdOff">移除邊框</button>
    </div>
    <div class="field" style="margin-top:12px">
      <label>字級 <b style="color:var(--gold-hi);font-family:var(--mono)">${fs==null?'預設 32':fs}</b></label>
      <input type="range" id="fsr" min="18" max="70" step="1" value="${fs||32}" style="width:100%">
    </div>
  </div>

  <div class="sec">
    <h3>配色盤<span>${pal.length} 組</span></h3>
    ${state.docs.length>1?`<select class="inp" id="palFrom" style="margin-bottom:9px">
      ${state.docs.map(d=>`<option ${d===palSrc?'selected':''}>${esc(d.name)}</option>`).join('')}</select>`:''}
    <div class="palette">${pal.map((p,i)=>`<button class="pchip ${p.k===curKey?'on':''}" data-p="${i}" title="${esc(p.label)} · ${p.count} 個區塊">
      <span class="gl" style="${palStyle(p)}">${esc(p.label)}</span></button>`).join('')}</div>
    <div class="scope"><button class="chip" id="scopeCat">套用目前顏色到「${esc(scopeName)}」（${scopeList.length}）</button>
      <button class="chip" id="scopeList">套用到目前清單（${visibleBlocks().length}）</button></div>
  </div>

  <div class="sec">
    <h3>小地圖圖示</h3>
    <button class="toggle ${mm?'on':''}" id="mmToggle"><span class="box">${mm?'✕':''}</span>顯示小地圖圖示</button>
    ${mm?`<div style="display:grid;grid-template-columns:70px 1fr 1fr;gap:7px;margin-top:8px">
      <select class="inp" id="mmSize">${[0,1,2].map(s=>`<option value="${s}" ${mm.size===s?'selected':''}>${['大','中','小'][s]}</option>`).join('')}</select>
      <select class="inp" id="mmColor">${MM_COLORS.map(c=>`<option ${mm.color===c?'selected':''}>${c}</option>`).join('')}</select>
      <select class="inp" id="mmShape">${MM_SHAPES.map(s=>`<option ${mm.shape===s?'selected':''}>${s}</option>`).join('')}</select>
    </div>`:''}
  </div>

  <div class="sec">
    <h3>光柱與音效</h3>
    <button class="toggle ${beam?'on':''}" id="beamToggle"><span class="box">${beam?'✕':''}</span>掉落光柱 PlayEffect</button>
    ${beam?`<div style="display:flex;gap:7px;margin-top:8px">
      <select class="inp" id="beamColor">${MM_COLORS.map(c=>`<option ${beam.color===c?'selected':''}>${c}</option>`).join('')}</select>
      <button class="toggle ${beam.temp?'on':''}" id="beamTemp" style="flex:0 0 auto;width:94px"><span class="box">${beam.temp?'✕':''}</span>Temp</button>
    </div>`:''}
    <div class="field" style="margin-top:12px"><label>自訂音效檔</label>
      <input class="inp" id="snd" value="${esc(snd)}" placeholder="例如 文子过滤音效\\崇神石.mp3"></div>
    <button class="toggle ${noDrop?'on':''}" id="ddsToggle"><span class="box">${noDrop?'✕':''}</span>關閉預設掉落音</button>
  </div>

  <div class="sec">
    <h3>條件<span>${conds.length}</span></h3>
    ${conds.map(r=>{
      const ri=b.rules.indexOf(r);
      const trs=r.values.map(v=>tr(v.v)).filter(Boolean);
      return `<div class="cond" data-ri="${ri}">
        <div class="hd"><input class="k" value="${esc(r.key)}" spellcheck="false">
          <select>${OPS.map(o=>`<option value="${o}" ${r.op===o?'selected':''}>${o||'—'}</option>`).join('')}</select>
          <button class="x" title="刪除條件">✕</button></div>
        <textarea rows="${Math.min(9,r.values.length||1)}" spellcheck="false">${esc(r.values.map(v=>v.v).join('\n'))}</textarea>
        ${trs.length?`<div class="tr">${esc(trs.slice(0,8).join('、'))}${trs.length>8?' …':''}</div>`:''}
      </div>`;
    }).join('')}
    <button class="addcond" id="addcond">＋ 新增條件</button>
    <div class="hintline">一行一個值。下面灰字是查到的官方繁中譯名。</div>
  </div>`;
}
function renderAll(){
  renderFiles(); renderOutline(); renderList(true); renderInspector(); renderFloor(); syncLint();
}
function refreshSelected(){
  const b=curBlock(); if(!b) return;
  const row=document.querySelector(`.row[data-id="${b.id}"]`);
  if(row) row.outerHTML=rowHTML(b);
  renderFloor(); renderFiles(); syncLint();
}
function syncLint(){
  if(!state.doc) return;
  const safe=safetyState();
  const n=lintAll().reduce((a,x)=>a+x.issues.length,0)+(safe.ok?0:1);
  $('#lintN').textContent=n?n:'';
  $('#safetyBtn').textContent=safe.ok?'防呆 ✓':'防呆 !';
  $('#safetyBtn').classList.toggle('primary',!safe.ok);
}

/* ======================================================================
   8. 事件
   ================================================================== */
document.querySelectorAll('.viewsw button').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.viewsw button').forEach(x=>x.classList.remove('on'));
  btn.classList.add('on'); state.view=btn.dataset.v; state.cat=null; state.section=null;
  renderOutline(); renderList(true); renderInspector();
}));
document.querySelectorAll('#vissw button').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('#vissw button').forEach(x=>x.classList.remove('on','s','h'));
  btn.classList.add('on'); if(btn.dataset.v==='show') btn.classList.add('s');
  if(btn.dataset.v==='hide') btn.classList.add('h');
  state.vis=btn.dataset.v; renderList(true); $('#list').scrollTop=0;
}));
$('#outline').addEventListener('click',e=>{
  const btn=e.target.closest('.olrow'); if(!btn) return;
  if(state.view==='taxonomy'){ state.cat=btn.dataset.cat||null; }
  else{
    const grp=btn.dataset.grp;
    if(grp&&e.target.closest('.caret')){ state.open.has(grp)?state.open.delete(grp):state.open.add(grp); renderOutline(); return; }
    state.section=btn.dataset.sec||null; if(grp) state.open.add(grp);
  }
  $('#q').value=''; state.query='';
  renderOutline(); renderList(true); $('#list').scrollTop=0;
});
$('#list').addEventListener('click',e=>{
  const row=e.target.closest('.row'); if(!row) return;
  state.sel=row.dataset.id;
  document.querySelectorAll('.row.on').forEach(r=>r.classList.remove('on'));
  row.classList.add('on');
  renderInspector(); renderFloor();
  if(window.innerWidth<=960) $('#bench').classList.add('open');
});
$('#list').addEventListener('scroll',()=>{
  const el=$('#list');
  if(el.scrollTop+el.clientHeight>el.scrollHeight-400) renderList(false);
});
let qt;
$('#q').addEventListener('input',e=>{ clearTimeout(qt); qt=setTimeout(()=>{ state.query=e.target.value; renderList(true); $('#list').scrollTop=0; },160); });
document.querySelectorAll('.tabs button').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));
  btn.classList.add('on'); state.tab=btn.dataset.tab; renderInspector();
}));
$('#files').addEventListener('click',e=>{ const t=e.target.closest('.ftab'); if(t) selectDoc(state.docs[+t.dataset.i]); });

$('#inspector').addEventListener('click',e=>{
  const b=curBlock(); if(!b) return;
  if(e.target.closest('#manageGroup')){ openGroupManager(b); return; }
  if(e.target.closest('#stackTiers')){ openStackTierManager(b); return; }
  const sh=e.target.closest('#showhide button');
  if(sh){ if(b.type!==sh.dataset.t){ snap([b],'showhide'); b.type=sh.dataset.t; touch(b); } renderInspector(); refreshSelected(); return; }
  const cx=e.target.closest('.ci .x');
  if(cx){ snap([b],'color'); dropRule(b,cx.closest('.ci').dataset.ckey); renderInspector(); refreshSelected(); return; }
  const pc=e.target.closest('.pchip');
  if(pc){ const src=state.docs.find(d=>d.name===state.palFrom)||state.doc;
    snap([b],'palette'); applyPalette(b,paletteOf(src)[+pc.dataset.p]); renderInspector(); refreshSelected(); return; }
  if(e.target.closest('#bdText')||e.target.closest('#bdBg')){
    const src=getColor(b,e.target.closest('#bdText')?'SetTextColor':'SetBackgroundColor');
    if(!src){ toast('來源顏色還沒設定'); return; }
    snap([b],'border'); putRule(b,'SetBorderColor',src.a>=255?[src.r,src.g,src.b]:[src.r,src.g,src.b,src.a]);
    renderInspector(); refreshSelected(); return;
  }
  if(e.target.closest('#bdOff')){ snap([b],'border'); dropRule(b,'SetBorderColor'); renderInspector(); refreshSelected(); return; }
  const sc=e.target.closest('#scopeCat')||e.target.closest('#scopeList');
  if(sc){
    const list = sc.id==='scopeList' ? visibleBlocks()
      : (state.view==='taxonomy'?state.doc.blocks.filter(x=>classify(x)===classify(b)):state.doc.blocks.filter(x=>x.section===b.section));
    if(!list.length) return;
    const p=curPalette(b);

  if(e.target.closest('#addcond')){ snap([b],'cond');
    b.rules.unshift({indent:b.indent==='\t'?'\t':'    ',key:'BaseType',op:'',values:[],comment:null,unknown:false,dirty:true,raw:null});
    touch(b); renderInspector(); refreshSelected(); return; }
  if(e.target.closest('#applysrc')){

    b.rules=txt.slice(1).filter(l=>l.trim()!=='').map(l=>{
      const r=parseRule(/^[ \t]/.test(l)?l:'    '+l); r.dirty=true; r.raw=null; return r; });
    touch(b); state.tab='props';
    document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.tab==='props'));

      </select>

  $('#groupSplit').onclick=()=>{
    const picked=groupCheckedValues();
    if(!picked.length){ toast('請先勾選要拆分的物品'); return; }
    if(picked.length>=br.values.length){ toast('拆分時原群組至少要保留一項'); return; }
    snapDoc('split-group');
    const next=cloneBlock(source);
    putRule(next,'BaseType',picked,br.op);
    putRule(source,'BaseType',br.values.map(v=>v.v).filter(v=>!picked.includes(v)),br.op);
    const customName=$('#splitName').value.trim();
    if(customName) next.headComment=customName;

    finishGroupEdit(`已拆出新群組，共 ${picked.length} 項`);

    if(left.length){

    }

/* 通貨堆疊分色：較高門檻必須排在一般規則之前 */
function tierRowHTML(n,fg,bg,bd){
  return `<div class="tierrow">
    <label>最少掉落數量<input class="inp tiernum" type="number" min="2" max="50000" step="1" value="${n}"></label>
    <label>文字色<input class="tiercolor tierfg" type="color" value="${fg}"></label>
    <label>背景色<input class="tiercolor tierbg" type="color" value="${bg}"></label>
    <label>邊框色<input class="tiercolor tierbd" type="color" value="${bd}"></label>
    <button class="tierremove" title="移除此門檻">✕</button>
  </div>`;
}
function existingTier(base,n){
  return state.doc.blocks.find(b=>b!==base&&b.type===base.type&&b.section===base.section&&
    baseTypeKey(b)===baseTypeKey(base)&&selectorKey(b)===selectorKey(base)&&
    (()=>{ const r=findRule(b,'StackSize'); return r&&['','>=','>','=',
      '=='].includes(r.op)&&parseInt(r.values[0]?.v,10)===n; })());
}
function openStackTierManager(base){
  if(!positiveBaseRule(base)||findRule(base,'StackSize')||classify(base)!=='1') return;
  const fg=hexColor(getColor(base,'SetTextColor'),'#ffffff');
  const bg=hexColor(getColor(base,'SetBackgroundColor'),'#000000');
  const bd=hexColor(getColor(base,'SetBorderColor'),'#c8aa6e');
  $('#modalTitle').textContent='依掉落數量分色 · '+(officialName(base)||authorName(base)||'通貨');
  $('#modalBody').innerHTML=`
    <p style="margin:0;color:var(--muted)">每個門檻會建立一條 <b style="color:var(--gold-hi)">StackSize &gt;= 數量</b> 規則，並自動排在目前的一般數量規則之前。門檻請由程式排序，不需要自己調整先後。</p>
    <div class="tierrows" id="tierRows">${tierRowHTML(10,fg,bg,bd)}</div>
    <button class="addcond" id="tierAdd">＋ 新增一個數量門檻</button>
    <div class="hintline">例：20+ 用金色、10+ 用紅色；未達 10 個時沿用目前群組的原配色。同一門檻已存在時會更新配色並移到正確位置。</div>`;
  $('#modalFoot').innerHTML='<button class="btn" id="cbNo">取消</button><button class="btn primary" id="tierApply">建立／更新數量分色</button>';
  $('#modal').classList.add('on');
  $('#cbNo').onclick=()=>$('#modal').classList.remove('on');
  $('#tierAdd').onclick=()=>{
    const nums=[...$('#tierRows').querySelectorAll('.tiernum')].map(x=>+x.value).filter(Number.isFinite);
    const n=nums.length?Math.max(...nums)+10:10;
    $('#tierRows').insertAdjacentHTML('beforeend',tierRowHTML(n,fg,bg,bd));
  };
  $('#modalBody').onclick=e=>{
    const x=e.target.closest('.tierremove');
    if(x) x.closest('.tierrow').remove();
  };
  $('#tierApply').onclick=()=>{
    const rows=[...$('#tierRows').querySelectorAll('.tierrow')].map(row=>({
      n:parseInt(row.querySelector('.tiernum').value,10),
      fg:row.querySelector('.tierfg').value,bg:row.querySelector('.tierbg').value,bd:row.querySelector('.tierbd').value
    })).filter(x=>Number.isFinite(x.n)&&x.n>=2);
    if(!rows.length){ toast('至少需要一個 2 以上的數量門檻'); return; }
    const seen=new Set(),unique=[];
    for(const row of rows.sort((a,z)=>z.n-a.n)) if(!seen.has(row.n)){ seen.add(row.n); unique.push(row); }
    snapDoc('stack-tiers');
    for(const row of unique){
      let tier=existingTier(base,row.n);
      if(tier) removeBlock(tier);
      else{
        tier=cloneBlock(base);
        tier.headComment=((base.headComment||'').trim()||officialName(base)||'通貨')+` · ${row.n}+ 個`;
      }
      putRule(tier,'StackSize',[row.n],'>=');
      setHexColor(tier,'SetTextColor',row.fg);
      setHexColor(tier,'SetBackgroundColor',row.bg);
      setHexColor(tier,'SetBorderColor',row.bd);
      insertBlockBefore(base,tier);
    }
    state.sel=base.id;
    $('#modal').classList.remove('on');
    renderAll();
    toast(`已建立／更新 ${unique.length} 個數量門檻`);
  };
}

/* 樣式階級：勾選物品後抽出原群組，依相容條件合併並套用同一外觀 */
function assignablePresetItems(){
  const map=new Map();
  for(const b of state.doc.blocks){
    const r=positiveBaseRule(b);
    if(!r||findRule(b,'StackSize')) continue;
    for(const v of r.values){
      let x=map.get(v.v);
      if(!x){ x={v:v.v,blocks:[],cat:catName(classify(b))}; map.set(v.v,x); }
      x.blocks.push(b);
    }
  }
  return [...map.values()].sort((a,z)=>(a.cat.localeCompare(z.cat,'zh-Hant')||
    String(tr(a.v)||a.v).localeCompare(String(tr(z.v)||z.v),'zh-Hant')));
}
function styleTierPreview(t){
  return `color:${css(t.fg,DEF_FG)};background:${css(t.bg,DEF_BG)};border-color:${css(t.bd,'transparent')}`;
}
function renderPresetItemList(items,query){
  const q=String(query||'').trim().toLowerCase();
  const shown=items.filter(x=>!q||[x.v,tr(x.v)||'',x.cat].join(' ').toLowerCase().includes(q));
  $('#presetItems').innerHTML=shown.length?shown.map(x=>`<label class="presetitem">
    <input type="checkbox" data-item="${esc(x.v)}">
    <span><b>${esc(tr(x.v)||x.v)}</b>${tr(x.v)?` <small>${esc(x.v)}</small>`:''}</span>
    <em>${esc(x.cat)}</em>
  </label>`).join(''):'<div class="empty" style="padding:28px">找不到符合的物品</div>';
  return shown.length;
}
function presetSelectedValues(){
  return [...$('#presetItems').querySelectorAll('input:checked')].map(x=>x.dataset.item);
}
function applyPresetItems(values,tier){
  const wanted=new Set(values),groups=new Map();
  for(const b of state.doc.blocks.slice()){
    const r=positiveBaseRule(b); if(!r||findRule(b,'StackSize')) continue;
    const picked=r.values.map(v=>v.v).filter(v=>wanted.has(v));
    if(!picked.length) continue;
    const key=[b.section,classKey(b),selectorKey(b)].join('\u001c');
    let g=groups.get(key);
    if(!g){ g={ref:b,sources:[],values:[]}; groups.set(key,g); }
    g.sources.push({b,picked});
    for(const v of picked) if(!g.values.includes(v)) g.values.push(v);
  }
  if(!groups.size) return 0;
  snapDoc('style-preset');
  let first=null;
  for(const g of groups.values()){
    const next=cloneBlock(g.ref);
    next.headComment=`${tier.name} · ${g.values.length} 項`;
    putRule(next,'BaseType',g.values,positiveBaseRule(g.ref).op);
    applyStyleTier(next,tier);
    insertBlockBefore(g.ref,next);
    if(!first) first=next;
    for(const s of g.sources){
      const sr=positiveBaseRule(s.b); if(!sr) continue;
      const left=sr.values.map(v=>v.v).filter(v=>!s.picked.includes(v));
      if(left.length) putRule(s.b,'BaseType',left,sr.op); else removeBlock(s.b);
    }
  }
  state.sel=first?.id||state.sel;
  return groups.size;
}

  const cur=()=>state.styleTiers.find(t=>t.id===state.presetTier)||state.styleTiers[2];

  $('#modalBody').innerHTML=`

    <div class="presetgrid">${state.styleTiers.map(t=>`<button class="presetcard ${t.id===state.presetTier?'on':''}" data-tier="${t.id}">
      <span class="gl" style="${styleTierPreview(t)}">${esc(t.name)}</span><small>${esc(t.desc)} · ${t.font}px</small>
    </button>`).join('')}</div>
    <div style="display:flex;gap:7px">
      <input class="inp" id="presetSearch" type="search" placeholder="搜尋物品、英文名稱或分類">
      <button class="chip" id="presetAll" style="flex:0 0 auto">勾選搜尋結果</button>
      <button class="chip" id="presetNone" style="flex:0 0 auto">全部取消</button>
    </div>
    <div class="presetitems" id="presetItems"></div>
    <div class="hintline">目前共 ${items.length} 種可歸類物品；具有 StackSize 的數量分色規則會保留，不會被這裡拆掉。</div>`;
  $('#modalFoot').innerHTML='<button class="btn" id="cbNo">取消</button><button class="btn" id="presetCapture">用目前區塊覆蓋此階樣式</button><button class="btn primary" id="presetApply">套用到勾選物品</button>';
  $('#modal').classList.add('on');
  renderPresetItemList(items,'');
  $('#cbNo').onclick=()=>$('#modal').classList.remove('on');
  $('#presetSearch').oninput=e=>renderPresetItemList(items,e.target.value);
  $('#presetAll').onclick=()=>$('#presetItems').querySelectorAll('input').forEach(x=>x.checked=true);
  $('#presetNone').onclick=()=>$('#presetItems').querySelectorAll('input').forEach(x=>x.checked=false);
  $('#modalBody').onclick=e=>{
    const card=e.target.closest('.presetcard'); if(!card) return;
    state.presetTier=card.dataset.tier;
    $('#modalBody').querySelectorAll('.presetcard').forEach(x=>x.classList.toggle('on',x===card));
  };
  $('#presetCapture').onclick=()=>{
    const b=curBlock(); if(!b){ toast('請先在主畫面選一個已調好樣式的區塊'); return; }
    const i=state.styleTiers.findIndex(t=>t.id===state.presetTier);
    state.styleTiers[i]=captureStyleTier(b,state.styleTiers[i]);
    saveStyleTiers();
    $('#modal').classList.remove('on');
    toast(`已把目前區塊存成「${state.styleTiers[i].name}」樣式`);
  };
  $('#presetApply').onclick=()=>{
    const values=presetSelectedValues();
    if(!values.length){ toast('請先勾選要歸類的物品'); return; }
    const t=cur(),n=applyPresetItems(values,t);
    if(!n){ toast('找不到可套用的物品規則'); return; }
    $('#modal').classList.remove('on');
    renderAll();
    toast(`已把 ${values.length} 種物品套用為「${t.name}」`);
  };
}

function openSafetyManager(){
  if(!state.doc) return;
  const s=safetyState();
  $('#modalTitle').textContent='未分類物品防呆層';
  $('#modalBody').innerHTML=s.ok
    ? `<p style="margin:0 0 12px;color:#a9cf90">✓ 已找到有效的防呆層，而且位於 Filter 最後。</p>
       <div class="stagefloor" style="height:150px;border:1px solid var(--rule)"><div class="beam" style="background:linear-gradient(to top,${NAMED.Pink||'#ff00ff'},transparent)"></div>
       <span class="gl previewlabel" style="${labelStyle(s.b,24)}">${esc(officialName(s.b)||authorName(s.b)||'未分類／新物品')}</span></div>
       <div class="hintline">遊戲中若出現這個醒目樣式，代表物品沒有命中前方分類，應回到編輯器把它加入正確階級。</div>`
    : `<p style="margin:0 0 10px;color:#e2a89e">目前防呆層不完整：${!s.b?'找不到無條件 Show 兜底規則。':(!s.atEnd?'兜底規則不在 Filter 最後。':'兜底規則沒有特殊色、光柱、圖示或提示音。')}</p>
       <p style="margin:0;color:var(--muted)">修復後，所有未命中規則的物品會使用紫紅背景、白字、粉紅光柱、星形小地圖圖示與內建提示音。匯出時也會自動檢查並補上。</p>`;
  $('#modalFoot').innerHTML=s.ok
    ? '<button class="btn" id="cbNo">關閉</button><button class="btn" id="safetyRestyle">改用 Filter Forge 防呆樣式</button>'
    : '<button class="btn" id="cbNo">取消</button><button class="btn primary" id="safetyFix">立即修復</button>';
  $('#modal').classList.add('on');
  $('#cbNo').onclick=()=>$('#modal').classList.remove('on');
  const fix=()=>{
    snapDoc('safety-layer');
    const r=ensureSafetyLayer();
    applySafetyStyle(r.b);
    if(r.b!==state.doc.blocks[state.doc.blocks.length-1]) moveBlockToEnd(r.b);
    state.sel=r.b.id;
    $('#modal').classList.remove('on'); renderAll(); toast('防呆層已放到 Filter 最後');
  };
  if($('#safetyFix')) $('#safetyFix').onclick=fix;
  if($('#safetyRestyle')) $('#safetyRestyle').onclick=fix;
}

$('#addcat').addEventListener('click',()=>{
  $('#modalTitle').textContent='自訂分類';
  $('#modalBody').innerHTML=`
    <div class="field"><label>分類名稱</label><input class="inp" id="ncName" placeholder="例如 精華與化石"></div>
    <div class="field"><label>比對關鍵字（半形逗號分隔，會比對 Class、BaseType 與作者註解）</label>
      <input class="inp" id="ncKeys" placeholder="Essence,Fossil,Resonator"></div>
    <div class="hintline">自訂分類排在標準分類前面，優先比對。只存在這次操作期間。</div>
    ${state.userCats.length?'<div style="margin-top:14px">'+state.userCats.map((c,i)=>
      `<div style="display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #ffffff08">
        <span style="flex:1 1 auto">${esc(c.name)} <span style="color:var(--faint);font-size:11px">${esc(c.keys.join(', '))}</span></span>
        <button class="btn" data-delcat="${i}">刪除</button></div>`).join('')+'</div>':''}`;
  $('#modalFoot').innerHTML='<button class="btn" id="cbNo">關閉</button><button class="btn primary" id="cbYes">新增</button>';
  $('#modal').classList.add('on');
  $('#cbNo').onclick=()=>$('#modal').classList.remove('on');
  $('#cbYes').onclick=()=>{
    const n=$('#ncName').value.trim(), k=$('#ncKeys').value.split(',').map(s=>s.trim()).filter(Boolean);
    if(!n||!k.length){ toast('名稱和關鍵字都要填'); return; }
    state.userCats.push({id:'u'+state.userCats.length,name:n,keys:k});
    for(const b of state.doc.blocks) b._cat=null;
    $('#modal').classList.remove('on'); renderOutline(); renderList(true); toast('已新增分類「'+n+'」');
  };
  $('#modalBody').querySelectorAll('[data-delcat]').forEach(btn=>btn.onclick=()=>{
    state.userCats.splice(+btn.dataset.delcat,1);
    for(const b of state.doc.blocks) b._cat=null;
    $('#modal').classList.remove('on'); renderOutline(); renderList(true);
  });
});

/* 檔案 */
function blankFilterText(){
  return `# Filter Forge 新建空白 Filter
# 使用「樣式階級」或開啟其他 Filter 後開始建立規則

# 9.99 Filter Forge 防呆層
# 未命中任何前方規則的物品會以特殊色顯示
Show # Filter Forge 防呆層 - 未分類／未命中物品
    SetFontSize 45
    SetTextColor 255 255 255 255
    SetBorderColor 255 0 255 255
    SetBackgroundColor 100 0 100 255
    PlayAlertSound 6 300
    PlayEffect Pink
    MinimapIcon 0 Pink Star
`;
}
function starterTierLines(t){
  const lines=[];
  const cv=c=>c?[c.r,c.g,c.b].concat(c.a<255?[c.a]:[]).join(' '):null;
  if(t.fg) lines.push('    SetTextColor '+cv(t.fg));
  if(t.bg) lines.push('    SetBackgroundColor '+cv(t.bg));
  if(t.bd) lines.push('    SetBorderColor '+cv(t.bd));
  lines.push('    SetFontSize '+t.font);
  if(t.mm) lines.push(`    MinimapIcon ${t.mm.size} ${t.mm.color} ${t.mm.shape}`);
  if(t.beam) lines.push(`    PlayEffect ${t.beam.color}${t.beam.temp?' Temp':''}`);
  return lines.join('\n');
}
function starterBlocks(title,num,values,tier,extra){
  const chunks=[]; for(let i=0;i<values.length;i+=36) chunks.push(values.slice(i,i+36));
  return chunks.map((part,i)=>`Show # Filter Forge - ${title} - 待分級 ${i+1}/${chunks.length}
${extra?extra+'\n':''}    BaseType == ${part.map(v=>'"'+String(v).replace(/"/g,'')+'"').join(' ')}
${starterTierLines(tier)}
`).join('\n');
}
function buildFullStarterFilter(){
  const by={}; for(const [name,code] of Object.entries(NAMECAT)) (by[code]||(by[code]=[])).push(name);
  const tier=id=>state.styleTiers.find(t=>t.id===id);
  const groups=[
    {code:'1',num:'1',title:'通貨／精髓／化石',tier:'t5'},
    {code:'2',num:'2',title:'輿圖',tier:'t6'},
    {code:'3',num:'3',title:'輿圖碎片／聖甲蟲',tier:'t5'},
    {code:'4',num:'4',title:'聯盟／特殊物品',tier:'t6'},
    {code:'5',num:'5',title:'命運卡',tier:'t6'},
    {code:'6',num:'6',title:'技能與輔助寶石',tier:'t7'},
    {code:'7',num:'7',title:'傳奇與裝備底材',tier:'t6',extra:'    Rarity = Unique'},
    {code:'8',num:'8',title:'其他已知物品',tier:'t6'}
  ];
  const out=[`# Filter Forge 完整新建 Filter
# 由編輯器內建的 ${Object.keys(NAMES).length} 筆物品資料產生，不直接複製任何第三方 Filter
# 初始群組只是安全打樣，請使用「樣式階級」依當季價格重新分類
`];
  for(const g of groups){
    out.push(`# ${g.num} ${g.title}`);
    out.push(starterBlocks(g.title,g.num,by[g.code]||[],tier(g.tier),g.extra||''));
  }
  out.push(`# 9 廣義分類防漏
Show # Filter Forge - 未列名傳奇
    Rarity = Unique
${starterTierLines(tier('t4'))}

Show # Filter Forge - 輿圖
    Class "Maps"
${starterTierLines(tier('t6'))}

Show # Filter Forge - 稀有裝備
    Rarity = Rare
${starterTierLines(tier('t7'))}

Show # Filter Forge - 普通／魔法裝備
    Class "Amulets" "Belts" "Body Armours" "Boots" "Bows" "Claws" "Daggers" "Gloves" "Helmets" "One Hand Axes" "One Hand Maces" "One Hand Swords" "Quivers" "Rings" "Rune Daggers" "Sceptres" "Shields" "Staves" "Thrusting One Hand Swords" "Two Hand Axes" "Two Hand Maces" "Two Hand Swords" "Wands" "Warstaves"
    Rarity <= Magic
${starterTierLines(tier('t8'))}

${blankFilterText().split('\n').slice(3).join('\n')}`);
  return out.join('\n');
}
function openNewFilter(){
  $('#modalTitle').textContent='新建 Filter';
  $('#modalBody').innerHTML=`
    <p style="margin:0;color:var(--muted)">這裡只建立 Filter Forge 自己產生的 Filter，不會直接套用任何第三方 Filter 的規則與樣式。</p>
    <div class="presetgrid" style="grid-template-columns:repeat(2,minmax(0,1fr))">
      <button class="presetcard" data-newfilter="full" style="padding:12px">
        <span class="gl" style="color:#fff;background:#641933;border-color:#ff4f7d">Filter Forge 完整新建</span>
        <small>${Object.keys(NAMES).length} 筆內建物品 · 原創安全分組 · 建議</small>
      </button>
      <button class="presetcard" data-newfilter="blank" style="padding:12px">
        <span class="gl" style="color:#fff;background:#640064;border-color:#ff00ff">空白 Filter</span>
        <small>只含最後防呆層</small>
      </button>
    </div>
    <div class="hintline">完整新建會加入通貨、精髓、化石、碎片、聖甲蟲、聯盟物品、命運卡、寶石與傳奇／裝備底材，再以廣義規則和最後防呆層接住遺漏物品。</div>`;
  $('#modalFoot').innerHTML='<button class="btn" id="cbNo">取消</button>';
  $('#modal').classList.add('on');
  $('#cbNo').onclick=()=>$('#modal').classList.remove('on');
  $('#modalBody').onclick=e=>{
    const card=e.target.closest('[data-newfilter]'); if(!card) return;
    const id=card.dataset.newfilter;
    $('#modal').classList.remove('on');
    if(id==='full') addDoc(buildFullStarterFilter(),'FilterForge_完整新建.filter');
    else addDoc(blankFilterText(),'FilterForge_空白.filter');
    toast(id==='full'?'已建立 Filter Forge 完整 Filter':'已建立空白 Filter');
  };
}
function addDoc(text,name){
  const d=parseDoc(text,name);
  state.docs.push(d); selectDoc(d);
  $('#gate').classList.add('off'); $('#app').classList.add('on');
}
function selectDoc(d){
  state.doc=d; state.sel=null; state.section=null; state.cat=null; state.query=''; state.open=new Set();
  state.undo=[]; state.redo=[]; state.palFrom=d.name;
  const first=d.sections.find(s=>s.depth===1); if(first) state.open.add(first.num);
  $('#q').value=''; syncUndo(); renderAll();
}
function loadFiles(list){
  [...list].forEach(f=>{ const rd=new FileReader(); rd.onload=()=>addDoc(rd.result,f.name); rd.readAsText(f,'utf-8'); });
}
$('#fileinput').addEventListener('change',e=>{ loadFiles(e.target.files); e.target.value=''; });
$('#newDoc').addEventListener('click',openNewFilter);
$('#pick').addEventListener('click',()=>$('#fileinput').click());
$('#gatePick').addEventListener('click',()=>$('#fileinput').click());
$('#gateNew').addEventListener('click',openNewFilter);
const dz=$('#dz');
['dragenter','dragover'].forEach(t=>document.addEventListener(t,e=>{ e.preventDefault(); if(dz) dz.classList.add('hot'); }));
['dragleave','drop'].forEach(t=>document.addEventListener(t,e=>{ e.preventDefault(); if(dz) dz.classList.remove('hot'); }));
document.addEventListener('drop',e=>{ if(e.dataTransfer.files.length) loadFiles(e.dataTransfer.files); });

function download(toTW){
  const d=state.doc; if(!d) return;
  if(!safetyState().ok){
    snapDoc('safety-layer');
    ensureSafetyLayer();
    renderAll();
    toast('已自動補上未分類物品防呆層');
  }
  const blob=new Blob([serializeDoc(d,toTW)],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=d.name.replace(/(\.filter)?$/i,'')+(toTW?'_繁體':'_edited')+'.filter';
  a.click(); URL.revokeObjectURL(a.href);
  d.dirty=false; renderFiles(); toast('已匯出 '+a.download);
}
$('#save').addEventListener('click',()=>download(false));
$('#saveTW').addEventListener('click',()=>download(true));

window.addEventListener('beforeunload',e=>{
  if(state.docs.some(d=>d.dirty)){ e.preventDefault(); e.returnValue=''; }
});
document.addEventListener('keydown',e=>{
  if(!state.doc) return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?doRedo():doUndo(); return; }
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select') return;
  if(e.key!=='ArrowDown'&&e.key!=='ArrowUp') return;
  const arr=visibleBlocks(); if(!arr.length) return;
  e.preventDefault();
  let i=arr.findIndex(x=>x.id===state.sel);
  i = e.key==='ArrowDown'?Math.min(arr.length-1,i+1):Math.max(0,i-1);
  if(i<0) i=0;
  state.sel=arr[i].id;
  let g=0; while(state.shown<=i&&g++<300) renderList(false);
  document.querySelectorAll('.row.on').forEach(r=>r.classList.remove('on'));
  const row=document.querySelector(`.row[data-id="${state.sel}"]`);
  if(row){ row.classList.add('on'); row.scrollIntoView({block:'nearest'}); }
  renderInspector(); renderFloor();
});
let tt;
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('on'),2200); }
</script>
